<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ложка хил">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="spoon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Скруглённая тёмная плитка -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)" stroke="#334155" stroke-width="3"/>

  <!-- Ложка (акцент #F59E0B): чаша + ручка -->
  <g transform="rotate(-18 128 128)">
    <!-- Чаша ложки -->
    <ellipse cx="128" cy="92" rx="40" ry="50" fill="url(#spoon)"/>
    <!-- Внутренняя тень чаши -->
    <ellipse cx="128" cy="92" rx="27" ry="36" fill="#0F172A" opacity="0.28"/>
    <!-- Ручка -->
    <rect x="118" y="128" width="20" height="86" rx="10" fill="url(#spoon)"/>
  </g>

  <!-- «Хил»: синий медицинский крест поверх чаши ложки -->
  <g fill="#3B82F6">
    <rect x="112" y="70" width="24" height="64" rx="7"/>
    <rect x="92" y="90" width="64" height="24" rx="7"/>
  </g>
  <!-- Блик на кресте -->
  <rect x="112" y="70" width="24" height="26" rx="7" fill="#60A5FA" opacity="0.55"/>
</svg>
